# MU UI 模型元文件 - mu-ui-model.yaml
# 依据《合同管理需求规格说明书-V9.md》附录 C.7（v9.1 重写为 AI 原生交互模型）
model_type: UI
version: "2.0"
domain: "销售合同执行管理"

application:
  name: 销售合同执行管理系统
  uiProtocols:
    a2ui:    { version: "v0.9", catalogRef: "ontology-basic/v1" }
    mcpApps: { version: "SEP-1865" }

# ──────────────────────────────────────────────────────────────────────
# 能力目录：一个用户意图一条，扁平无层级（取代旧菜单树）
# ──────────────────────────────────────────────────────────────────────
capabilities:
  # 合同维护 / 审批 / 查询
  - capabilityId: cap-contract-create
    name: 录入销售合同
    intent: 创建一份销售合同，保存草稿或提交进入审批流
    utterances:
      - "新建一个销售合同"
      - "帮我录入东方公司的合同"
      - "起草一份新合同"
    uiUnitRef: ui-contract-maintain
    permissionRef: [PERM-CONTRACT-CREATE]

  - capabilityId: cap-contract-resubmit
    name: 修改并重新提交合同
    intent: 对被驳回的合同进行修改后重新提交审批
    utterances:
      - "重新提交这份合同"
      - "把驳回的合同改一下再提交"
    toolRef: contract_resubmit
    permissionRef: [PERM-CONTRACT-CREATE]

  - capabilityId: cap-contract-void-archive
    name: 作废或归档合同
    intent: 对已结束或异常终止的合同执行作废或归档
    utterances:
      - "把这份合同作废"
      - "归档一下合同 HT-2026-001"
    toolRef: contract_void_or_archive
    permissionRef: [PERM-CONTRACT-CREATE]

  - capabilityId: cap-contract-query
    name: 查询合同列表
    intent: 按合同编号、名称、类型、签订日期等条件查询合同
    utterances:
      - "查一下销售合同"
      - "看看有哪些合同"
    uiUnitRef: ui-contract-query
    permissionRef: [PERM-CONTRACT-QUERY-LIST, PERM-CONTRACT-QUERY-LIST-OWN-DEPT]

  - capabilityId: cap-contract-approve
    name: 审批合同
    intent: 审批待办的合同；含财务审批与总经理二级审批
    utterances:
      - "审批一下待办的合同"
      - "通过 HT-2026-001"
    uiUnitRef: ui-contract-approval
    permissionRef: [PERM-CONTRACT-APPROVE-FINANCE]

  - capabilityId: cap-contract-approve-gm
    name: 总经理审批合同
    intent: 对超过财务审批阈值的合同进行总经理二级审批
    utterances:
      - "总经理审批这份大额合同"
      - "走总经理审批"
    toolRef: contract_approve_general_manager
    permissionRef: [PERM-CONTRACT-APPROVE-GM]

  # 开票
  - capabilityId: cap-invoice-create
    name: 录入开票
    intent: 为合同录入开票，保存草稿或提交进入审批流
    utterances:
      - "给 HT-2026-001 开一张票"
      - "新建一张开票"
    uiUnitRef: ui-invoice-maintain
    permissionRef: [PERM-INVOICE-SAVE-DRAFT]

  - capabilityId: cap-invoice-resubmit
    name: 修改并重新提交开票
    intent: 对被驳回的开票进行修改后重新提交审批
    utterances:
      - "重新提交这张开票"
    toolRef: invoice_resubmit
    permissionRef: [PERM-INVOICE-SUBMIT]

  - capabilityId: cap-invoice-void
    name: 作废开票
    intent: 对错误或异常的开票执行作废
    utterances:
      - "把开票 INV-2026-001 作废"
    toolRef: invoice_void
    permissionRef: [PERM-INVOICE-SUBMIT]

  - capabilityId: cap-invoice-query
    name: 查询开票
    intent: 按开票编号、合同、开票状态、开票日期等条件查询开票
    utterances:
      - "查一下开票记录"
      - "有哪些开票"
    uiUnitRef: ui-invoice-query
    permissionRef: [PERM-CONTRACT-QUERY-UNRECEIVED, PERM-CONTRACT-QUERY-UNRECEIVED-OWN-DEPT]

  - capabilityId: cap-invoice-approve
    name: 审批开票
    intent: 审批待办的开票
    utterances:
      - "审批一下开票"
      - "通过 INV-2026-001"
    uiUnitRef: ui-invoice-approval
    permissionRef: [PERM-INVOICE-APPROVE]

  # 收款
  - capabilityId: cap-receipt-create
    name: 录入收款
    intent: 为某张开票录入收款记录
    utterances:
      - "登记一笔收款"
      - "给 INV-2026-001 录一笔收款"
    uiUnitRef: ui-receipt-maintain
    permissionRef: [PERM-RECEIPT-RECORD]

  - capabilityId: cap-receipt-reverse
    name: 冲销收款
    intent: 对错误或异常的收款记录执行冲销
    utterances:
      - "把收款 R-2026-001 冲销掉"
    toolRef: receipt_reverse
    permissionRef: [PERM-RECEIPT-REVERSE]

  - capabilityId: cap-receipt-query
    name: 查询收款
    intent: 按收款编号、合同、开票、收款时间等条件查询收款
    utterances:
      - "查一下收款记录"
    uiUnitRef: ui-receipt-query
    permissionRef: [PERM-RECEIPT-RECORD]

  # 报表
  - capabilityId: cap-contract-execution-analysis
    name: 合同执行情况分析
    intent: 按部门、责任人、签订日期分析合同的开票与收款完成情况
    utterances:
      - "看一下合同执行情况"
      - "各部门的合同完成率"
    uiUnitRef: ui-contract-execution-report
    permissionRef: [PERM-CONTRACT-QUERY-EXECUTION, PERM-CONTRACT-QUERY-EXECUTION-OWN-DEPT]

  - capabilityId: cap-dept-summary
    name: 部门合同统计分析
    intent: 按部门汇总合同数量、金额、开票、收款与结清情况
    utterances:
      - "部门合同统计"
    uiUnitRef: ui-dept-report
    permissionRef: [PERM-CONTRACT-QUERY-DEPT-SUMMARY, PERM-CONTRACT-QUERY-DEPT-SUMMARY-OWN-DEPT]

  - capabilityId: cap-invoiced-unreceived
    name: 已开票未收款分析
    intent: 查询已开票但尚未收款的明细
    utterances:
      - "哪些开票还没收款"
      - "已开票未收款明细"
    uiUnitRef: ui-invoiced-unreceived-report
    permissionRef: [PERM-CONTRACT-QUERY-UNRECEIVED, PERM-CONTRACT-QUERY-UNRECEIVED-OWN-DEPT]

  # 主数据
  - capabilityId: cap-product-maintain
    name: 产品信息维护
    intent: 维护产品档案（编号、名称、类型）
    utterances:
      - "维护一下产品"
      - "新增一个产品"
    uiUnitRef: ui-product-maintain
    permissionRef: [PERM-PRODUCT-MAINTAIN]

  - capabilityId: cap-customer-maintain
    name: 客户信息维护
    intent: 维护客户档案（编号、名称、类型）
    utterances:
      - "维护一下客户"
      - "新增一个客户"
    uiUnitRef: ui-customer-maintain
    permissionRef: [PERM-CUSTOMER-MAINTAIN]

  - capabilityId: cap-department-maintain
    name: 部门信息维护
    intent: 维护部门档案
    utterances:
      - "维护一下部门"
    uiUnitRef: ui-department-maintain
    permissionRef: [PERM-DEPARTMENT-MAINTAIN]

  - capabilityId: cap-employee-maintain
    name: 人员信息维护
    intent: 维护人员档案（编号、名称、所属部门）
    utterances:
      - "维护一下人员"
      - "新增一个员工"
    uiUnitRef: ui-employee-maintain
    permissionRef: [PERM-EMPLOYEE-MAINTAIN]

# ──────────────────────────────────────────────────────────────────────
# 工具契约：与 M2 中 triggerType=USER_ACTION 的行为严格 1:1
#   （triggerType=SYSTEM 的 3 个行为不暴露为工具，由 syncTriggers 同步触发）
# ──────────────────────────────────────────────────────────────────────
tools:
  # ── 合同写操作 ──
  - toolName: contract_save_as_draft
    behaviorRef: Contract_SaveAsDraft
    title: 保存合同草稿
    description: 保存合同数据并置为草稿状态，不触发审批流
    inputSchema:  { objectRef: Contract, fields: [contractNo, contractName, contractType, productId, customerId, departmentId, ownerId, signDate, taxRate, totalAmount, purchaseAmount, remark, stages] }
    outputSchema: { objectRef: Contract, fields: [contractId, status] }
    annotations:  { readOnlyHint: false, destructiveHint: false }
    permissionRef: [PERM-CONTRACT-SAVE-DRAFT]

  - toolName: contract_submit
    behaviorRef: Contract_Submit
    title: 提交合同审批
    description: 保存合同并提交进入审批流（财务审批 → 必要时总经理二级审批）
    inputSchema:  { objectRef: Contract, fields: [contractNo, contractName, contractType, productId, customerId, departmentId, ownerId, signDate, taxRate, totalAmount, purchaseAmount, remark, stages] }
    outputSchema: { objectRef: Contract, fields: [contractId, status] }
    annotations:  { readOnlyHint: false, destructiveHint: false }
    permissionRef: [PERM-CONTRACT-SUBMIT]

  - toolName: contract_resubmit
    behaviorRef: Contract_Resubmit
    title: 修改并重新提交合同
    description: 修改被驳回的合同后重新提交进入审批流
    inputSchema:  { objectRef: Contract, fields: [contractId, contractNo, contractName, contractType, productId, customerId, departmentId, ownerId, signDate, taxRate, totalAmount, purchaseAmount, remark, stages] }
    outputSchema: { objectRef: Contract, fields: [contractId, status] }
    annotations:  { readOnlyHint: false, destructiveHint: false }
    permissionRef: [PERM-CONTRACT-CREATE]

  - toolName: contract_void_or_archive
    behaviorRef: Contract_VoidOrArchive
    title: 作废或归档合同
    description: 对已结束或异常的合同执行作废或归档操作
    inputSchema:  { objectRef: Contract, fields: [contractId, action] }
    outputSchema: { objectRef: Contract, fields: [contractId, status] }
    annotations:  { readOnlyHint: false, destructiveHint: true }
    permissionRef: [PERM-CONTRACT-CREATE]

  # ── 开票写操作 ──
  - toolName: invoice_save_as_draft
    behaviorRef: Invoice_SaveAsDraft
    title: 保存开票草稿
    description: 保存开票数据并置为草稿状态，不触发审批
    inputSchema:  { objectRef: Invoice, fields: [invoiceNo, contractId, invoiceDate, invoiceAmount, invoiceTaxRate, receivedFlag, allocations] }
    outputSchema: { objectRef: Invoice, fields: [invoiceId, approvalStatus] }
    annotations:  { readOnlyHint: false, destructiveHint: false }
    permissionRef: [PERM-INVOICE-SAVE-DRAFT]

  - toolName: invoice_submit
    behaviorRef: Invoice_Submit
    title: 提交开票审批
    description: 保存开票并提交进入审批流
    inputSchema:  { objectRef: Invoice, fields: [invoiceNo, contractId, invoiceDate, invoiceAmount, invoiceTaxRate, receivedFlag, allocations] }
    outputSchema: { objectRef: Invoice, fields: [invoiceId, approvalStatus] }
    annotations:  { readOnlyHint: false, destructiveHint: false }
    permissionRef: [PERM-INVOICE-SUBMIT]

  - toolName: invoice_resubmit
    behaviorRef: Invoice_Resubmit
    title: 修改并重新提交开票
    description: 修改被驳回的开票后重新提交进入审批流
    inputSchema:  { objectRef: Invoice, fields: [invoiceId, invoiceNo, contractId, invoiceDate, invoiceAmount, invoiceTaxRate, receivedFlag, allocations] }
    outputSchema: { objectRef: Invoice, fields: [invoiceId, approvalStatus] }
    annotations:  { readOnlyHint: false, destructiveHint: false }
    permissionRef: [PERM-INVOICE-SUBMIT]

  - toolName: invoice_void
    behaviorRef: Invoice_Void
    title: 作废开票
    description: 对错误或异常的开票执行作废
    inputSchema:  { objectRef: Invoice, fields: [invoiceId, reason] }
    outputSchema: { objectRef: Invoice, fields: [invoiceId, approvalStatus] }
    annotations:  { readOnlyHint: false, destructiveHint: true }
    permissionRef: [PERM-INVOICE-SUBMIT]

  # ── 收款 ──
  - toolName: receipt_record
    behaviorRef: Receipt_Record
    title: 录入收款
    description: 为某张开票登记一笔收款记录
    inputSchema:  { objectRef: Receipt, fields: [receiptNo, contractId, invoiceId, receiptAmount, receiptTime, receiptMethod, remark] }
    outputSchema: { objectRef: Receipt, fields: [receiptId] }
    annotations:  { readOnlyHint: false, destructiveHint: false }
    permissionRef: [PERM-RECEIPT-RECORD]

  - toolName: receipt_reverse
    behaviorRef: Receipt_Reverse
    title: 冲销收款
    description: 对错误或异常的收款记录执行冲销
    inputSchema:  { objectRef: Receipt, fields: [receiptId, reason] }
    outputSchema: { objectRef: Receipt, fields: [receiptId] }
    annotations:  { readOnlyHint: false, destructiveHint: true }
    permissionRef: [PERM-RECEIPT-REVERSE]

  # ── 主数据 ──
  - toolName: product_maintain
    behaviorRef: Product_Maintain
    title: 维护产品
    description: 新增或修改产品档案
    inputSchema:  { objectRef: Product, fields: [productId, productName, productType] }
    outputSchema: { objectRef: Product, fields: [productId] }
    annotations:  { readOnlyHint: false, destructiveHint: false }
    permissionRef: [PERM-PRODUCT-MAINTAIN]

  - toolName: customer_maintain
    behaviorRef: Customer_Maintain
    title: 维护客户
    description: 新增或修改客户档案
    inputSchema:  { objectRef: Customer, fields: [customerId, customerName, customerType] }
    outputSchema: { objectRef: Customer, fields: [customerId] }
    annotations:  { readOnlyHint: false, destructiveHint: false }
    permissionRef: [PERM-CUSTOMER-MAINTAIN]

  - toolName: department_maintain
    behaviorRef: Department_Maintain
    title: 维护部门
    description: 新增或修改部门档案
    inputSchema:  { objectRef: Department, fields: [departmentId, departmentName] }
    outputSchema: { objectRef: Department, fields: [departmentId] }
    annotations:  { readOnlyHint: false, destructiveHint: false }
    permissionRef: [PERM-DEPARTMENT-MAINTAIN]

  - toolName: employee_maintain
    behaviorRef: Employee_Maintain
    title: 维护人员
    description: 新增或修改人员档案
    inputSchema:  { objectRef: Employee, fields: [employeeId, employeeName, departmentId] }
    outputSchema: { objectRef: Employee, fields: [employeeId] }
    annotations:  { readOnlyHint: false, destructiveHint: false }
    permissionRef: [PERM-EMPLOYEE-MAINTAIN]

  # ── 查询 / 报表（readOnlyHint=true）──
  - toolName: contract_query_list
    behaviorRef: Contract_QueryList
    title: 查询合同列表
    description: 按合同编号、名称、类型、部门、日期范围等条件查询合同列表
    inputSchema:  { objectRef: Contract, fields: [contractNo, contractName, contractType, departmentId, signDateFrom, signDateTo] }
    outputSchema: { objectRef: Contract, fields: [contractId, contractNo, contractName, contractType, customerId, departmentId, ownerId, totalAmount, status] }
    annotations:  { readOnlyHint: true, destructiveHint: false }
    permissionRef: [PERM-CONTRACT-QUERY-LIST, PERM-CONTRACT-QUERY-LIST-OWN-DEPT]

  - toolName: contract_query_detail
    behaviorRef: Contract_QueryDetail
    title: 查看合同详情
    description: 按合同 ID 返回单份合同的完整信息（含付款阶段明细）
    inputSchema:  { objectRef: Contract, fields: [contractId] }
    outputSchema: { objectRef: Contract, fields: [contractId, contractNo, contractName, contractType, productId, customerId, departmentId, ownerId, signDate, taxRate, totalAmount, purchaseAmount, remark, stages] }
    annotations:  { readOnlyHint: true, destructiveHint: false }
    permissionRef: [PERM-CONTRACT-QUERY-DETAIL, PERM-CONTRACT-QUERY-DETAIL-OWN-DEPT]

  - toolName: contract_query_execution_analysis
    behaviorRef: Contract_QueryExecutionAnalysis
    title: 合同执行情况分析
    description: 按部门、责任人、签订日期分析合同的开票与收款完成情况
    inputSchema:  { objectRef: Contract, fields: [departmentId, ownerId, signDateFrom, signDateTo] }
    outputSchema: { queryReportRef: REP-CONTRACT-EXECUTION }
    annotations:  { readOnlyHint: true, destructiveHint: false }
    permissionRef: [PERM-CONTRACT-QUERY-EXECUTION, PERM-CONTRACT-QUERY-EXECUTION-OWN-DEPT]

  - toolName: contract_query_department_summary
    behaviorRef: Contract_QueryDepartmentSummary
    title: 部门合同统计分析
    description: 按部门汇总合同数量、金额、开票、收款与结清情况
    inputSchema:  { objectRef: Contract, fields: [signDateFrom, signDateTo, departmentId] }
    outputSchema: { queryReportRef: REP-DEPT-CONTRACT-SUMMARY }
    annotations:  { readOnlyHint: true, destructiveHint: false }
    permissionRef: [PERM-CONTRACT-QUERY-DEPT-SUMMARY, PERM-CONTRACT-QUERY-DEPT-SUMMARY-OWN-DEPT]

  - toolName: contract_query_invoiced_unreceived
    behaviorRef: Contract_QueryInvoicedUnreceived
    title: 已开票未收款分析
    description: 查询已开票但尚未收款的明细
    inputSchema:  { objectRef: Contract, fields: [departmentId, invoiceDateFrom, invoiceDateTo] }
    outputSchema: { queryReportRef: REP-INVOICED-UNRECEIVED }
    annotations:  { readOnlyHint: true, destructiveHint: false }
    permissionRef: [PERM-CONTRACT-QUERY-UNRECEIVED, PERM-CONTRACT-QUERY-UNRECEIVED-OWN-DEPT]

  # ── 审批 ──
  - toolName: contract_approve_finance
    behaviorRef: Contract_ApproveFinance
    title: 财务审批合同
    description: 财务经理对合同执行通过或驳回（含审批意见）
    inputSchema:  { objectRef: Contract, fields: [contractId, decision, comment] }
    outputSchema: { objectRef: Contract, fields: [contractId, status] }
    annotations:  { readOnlyHint: false, destructiveHint: false }
    permissionRef: [PERM-CONTRACT-APPROVE-FINANCE]

  - toolName: contract_approve_general_manager
    behaviorRef: Contract_ApproveGeneralManager
    title: 总经理审批合同
    description: 总经理对超过财务审批阈值的合同执行二级审批
    inputSchema:  { objectRef: Contract, fields: [contractId, decision, comment] }
    outputSchema: { objectRef: Contract, fields: [contractId, status] }
    annotations:  { readOnlyHint: false, destructiveHint: false }
    permissionRef: [PERM-CONTRACT-APPROVE-GM]

  - toolName: invoice_approve_finance
    behaviorRef: Invoice_ApproveFinance
    title: 审批开票
    description: 财务对开票执行通过或驳回（含审批意见）
    inputSchema:  { objectRef: Invoice, fields: [invoiceId, decision, comment] }
    outputSchema: { objectRef: Invoice, fields: [invoiceId, approvalStatus] }
    annotations:  { readOnlyHint: false, destructiveHint: false }
    permissionRef: [PERM-INVOICE-APPROVE]

# ──────────────────────────────────────────────────────────────────────
# 界面单元：unitType × renderMode 两个正交维度
#   本系统全部为 A2UI_SURFACE / STATIC（事务型 + 建模期确定）
# ──────────────────────────────────────────────────────────────────────
uiUnits:
  # ════════════════════════════════════════════════════════════════
  # 合同录入（主从维护，A2UI_SURFACE / STATIC）
  # ════════════════════════════════════════════════════════════════
  - uiUnitId: ui-contract-maintain
    name: 合同录入
    unitType: A2UI_SURFACE
    renderMode: STATIC
    surface:
      surfaceId: contract-maintain
      root: root-col
      dataModel:
        "/contract": Contract
        "/contract/stages": Contract.stages
      components:
        - id: root-col
          component: Column
          children: { explicitList: [hd-title, card-main, tbl-stage, row-actions] }
        - id: hd-title
          component: Heading
          value: { literalString: "合同录入" }
        - id: card-main
          component: Card
          label: 主对象字段
          children: { explicitList: [txt-contract-no, txt-contract-name, sel-contract-type, pick-product, pick-customer, pick-department, pick-owner, dtp-sign-date, txt-tax-rate, num-total-amount, num-purchase-amount, txt-remark] }
        - id: txt-contract-no
          component: TextField
          label: 合同编号
          required: true
          value: { path: "/contract/contractNo" }
          dataBinding: Contract.contractNo
        - id: txt-contract-name
          component: TextField
          label: 合同名称
          required: true
          value: { path: "/contract/contractName" }
          dataBinding: Contract.contractName
        - id: sel-contract-type
          component: Select
          label: 合同类型
          required: true
          value: { path: "/contract/contractType" }
          dataBinding: Contract.contractType
        - id: pick-product
          component: EntityPicker
          label: 所属产品
          required: true
          value: { path: "/contract/productId" }
          dataBinding: Contract.productId
          targetAggregate: Product
          searchToolRef: contract_query_list
        - id: pick-customer
          component: EntityPicker
          label: 所属客户
          required: true
          value: { path: "/contract/customerId" }
          dataBinding: Contract.customerId
          targetAggregate: Customer
          searchToolRef: contract_query_list
        - id: pick-department
          component: EntityPicker
          label: 所属部门
          required: true
          value: { path: "/contract/departmentId" }
          dataBinding: Contract.departmentId
          targetAggregate: Department
          searchToolRef: contract_query_list
        - id: pick-owner
          component: EntityPicker
          label: 责任人
          required: true
          value: { path: "/contract/ownerId" }
          dataBinding: Contract.ownerId
          targetAggregate: Employee
          searchToolRef: contract_query_list
        - id: dtp-sign-date
          component: DateTimeInput
          label: 签订时间
          required: true
          value: { path: "/contract/signDate" }
          dataBinding: Contract.signDate
        - id: txt-tax-rate
          component: NumberInput
          label: 合同税率
          required: true
          value: { path: "/contract/taxRate" }
          dataBinding: Contract.taxRate
        - id: num-total-amount
          component: NumberInput
          label: 合同总金额
          required: true
          value: { path: "/contract/totalAmount" }
          dataBinding: Contract.totalAmount
        - id: num-purchase-amount
          component: NumberInput
          label: 采购金额
          required: true
          value: { path: "/contract/purchaseAmount" }
          dataBinding: Contract.purchaseAmount
        - id: txt-remark
          component: TextArea
          label: 备注
          value: { path: "/contract/remark" }
          dataBinding: Contract.remark
